name: Build ESP32 Firmware

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          ~/.cache/pip
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Extract version from tag or commit
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="dev-${GITHUB_SHA::8}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Update version in code
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        # Update version in config.h
        sed -i 's/#define FIRMWARE_VERSION ".*"/#define FIRMWARE_VERSION "'"$VERSION"'"/' src/config.h

    - name: Build firmware
      run: |
        pio run --environment esp32dev

    - name: Rename firmware with version
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        cp .pio/build/esp32dev/firmware.bin qsafe-ota.bin
        cp .pio/build/esp32dev/firmware.bin qsafe-esp32-$VERSION.bin

    - name: Generate firmware metadata
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        FIRMWARE_FILE="qsafe-ota.bin"
        SIZE=$(stat -c%s "$FIRMWARE_FILE")
        MD5=$(md5sum "$FIRMWARE_FILE" | cut -d' ' -f1)

        cat > firmware-metadata.json << EOF
        {
          "version": "$VERSION",
          "filename": "$FIRMWARE_FILE",
          "size": $SIZE,
          "md5": "$MD5",
          "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "git_commit": "${{ github.sha }}",
          "git_ref": "${{ github.ref }}"
        }
        EOF

        cat firmware-metadata.json

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ steps.version.outputs.VERSION }}
        path: |
          qsafe-*.bin
          firmware-metadata.json
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          qsafe-*.bin
          firmware-metadata.json
        body: |
          ## ESP32 Seismograph Firmware ${{ steps.version.outputs.VERSION }}

          ### Installation

          #### Automatic OTA Update (Recommended)
          The ESP32 nodes will automatically check for and install this update within 24 hours.
          To force an immediate update, restart your ESP32 nodes.

          #### Manual Update via Web Interface
          1. Download `qsafe-ota.bin`
          2. Connect to your ESP32's WiFi network or access its web interface
          3. Navigate to the firmware update section
          4. Upload the .bin file

          #### Manual Update via PlatformIO
          1. Download `qsafe-ota.bin`
          2. Use esptool.py: `esptool.py --port <PORT> write_flash 0x10000 qsafe-ota.bin`

          ### Firmware Details
          - **Version:** ${{ steps.version.outputs.VERSION }}
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Git Commit:** ${{ github.sha }}

          ### Changelog
          See commit history for detailed changes.

        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
